<article class="product-card">
  <a class="product-image-wrap" href="{% url 'product' p.slug %}">
    {% if p.badge %}<span class="product-badge">{{ p.badge }}</span>{% endif %}
    {% if p.image %}<img src="{{ p.image }}" alt="{{ p.name }}" loading="lazy">{% else %}<span class="product-image-empty" aria-hidden="true"></span>{% endif %}
    <span class="quick-view">View product <span>↗</span></span>
  </a>
  <div class="product-meta"><div><a class="product-name" href="{% url 'product' p.slug %}">{{ p.name }}</a><div class="product-sub">{{ p.category }}</div></div><span class="product-price">{{ p.price_display }}</span></div>
</article>
