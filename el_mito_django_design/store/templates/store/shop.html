{% extends 'store/base.html' %}{% block title %}Shop all — EL MITO{% endblock %}{% block content %}
<section class="shop-intro"><div><span class="eyebrow">THE EL MITO COLLECTION</span><h1>{% if category %}{{ category }}{% elif query %}Search results{% else %}All pieces{% endif %}</h1></div><span class="shop-count">{{ products|length }} pieces</span></section>
<form class="shop-toolbar" method="get"><div class="filter-links"><a class="{% if not category_slug %}active{% endif %}" href="{% url 'shop' %}">All</a>{% for c in categories %}<a class="{% if category_slug == c.slug %}active{% endif %}" href="?category={{ c.slug|urlencode }}">{{ c.name }}</a>{% endfor %}</div><input type="search" name="q" value="{{ query }}" placeholder="Search products" aria-label="Search products"><select name="category" aria-label="Category"><option value="">All categories</option>{% for c in categories %}<option value="{{ c.slug }}" {% if category_slug == c.slug %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select><select name="size" aria-label="Size"><option value="">All sizes</option>{% for size in facets.sizes %}<option value="{{ size }}" {% if size in filters.sizes %}selected{% endif %}>{{ size }}</option>{% endfor %}</select><select name="color" aria-label="Colour"><option value="">All colours</option>{% for color in facets.colors %}<option value="{{ color.name }}" {% if color.name in filters.colors %}selected{% endif %}>{{ color.name }}</option>{% endfor %}</select><label for="sort">Sort by</label><select name="sort" id="sort"><option value="newest" {% if sort == 'newest' %}selected{% endif %}>Newest</option><option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>Price: low to high</option><option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>Price: high to low</option><button class="text-link" type="submit">Apply</button></form>
<div class="section shop-grid-section"><div class="product-grid shop-grid">{% for p in products %}{% include 'store/_product_card.html' with p=p %}{% empty %}<div class="empty-state"><h2>No pieces found.</h2><p>Try another search or explore the full collection.</p><a class="button button-dark" href="{% url 'shop' %}">View all pieces</a></div>{% endfor %}</div></div>
{% endblock %}
